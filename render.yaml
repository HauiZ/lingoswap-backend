          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: FRIEND_SERVICE_URL
        fromService:
          name: lingoswap-friend-service
          type: web
          property: host
      - key: PRESENCE_SERVICE_URL
        fromService:
          name: lingoswap-presence-service
          type: web
          property: host
      - key: CHAT_SERVICE_URL
        fromService:
          name: lingoswap-chat-service
          type: web
          property: host

  # ─── Chat Service ──────────────────────────────────────────────
