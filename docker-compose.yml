version: '3.8'

services:
  # ─── LingoSwap Backend ───
  app:
    build: .
    container_name: lingoswap-backend
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DB_URI=mongodb://mongo:27017/lingoswap
      - REDIS_URI=redis://redis:6379
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - app-logs:/app/logs
    networks:
      - lingoswap-network

  # ─── MongoDB ───
  mongo:
    image: mongo:7
    container_name: lingoswap-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lingoswap-network

  # ─── Redis ───
  redis:
    image: redis:7-alpine
    container_name: lingoswap-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lingoswap-network

volumes:
  mongo-data:
  redis-data:
  app-logs:

networks:
  lingoswap-network:
    driver: bridge
