# ═══════════════════════════════════════════════════════════════════
# LingoSwap — Render.com Blueprint
# ═══════════════════════════════════════════════════════════════════
# Deploy tất cả microservices lên Render.com
# Docs: https://render.com/docs/blueprint-spec
#
# Cách dùng:
#   1. Push code lên GitHub
#   2. Vào Render Dashboard → New → Blueprint
#   3. Chọn repo và file render.yaml này
#   4. Điền các env vars (marked as sync: false)
# ═══════════════════════════════════════════════════════════════════

services:

  # ─── API Gateway ─────────────────────────────────────────────
  - type: web
    name: lingoswap-api-gateway
    runtime: node
    rootDir: services/api-gateway
    buildCommand: npm install
    startCommand: npm start
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        sync: false
      - key: REDIS_URI
        fromService:
          name: lingoswap-redis
          type: redis
          property: connectionString
      - key: AUTH_SERVICE_URL
        fromService:
          name: lingoswap-auth-service
          type: web
          property: host
      - key: USER_SERVICE_URL
        fromService:
          name: lingoswap-user-service
          type: web
          property: host
      - key: CHAT_SERVICE_URL
        fromService:
          name: lingoswap-chat-service
          type: web
          property: host
      - key: MATCH_SERVICE_URL
        fromService:
          name: lingoswap-match-service
          type: web
          property: host
      - key: FRIEND_SERVICE_URL
        fromService:
          name: lingoswap-friend-service
          type: web
          property: host
      - key: NOTIFICATION_SERVICE_URL
        fromService:
          name: lingoswap-notification-service
          type: web
          property: host
      - key: PRESENCE_SERVICE_URL
        fromService:
          name: lingoswap-presence-service
          type: web
          property: host
      - key: REPORT_SERVICE_URL
        fromService:
          name: lingoswap-report-service
          type: web
          property: host
      - key: ADMIN_SERVICE_URL
        fromService:
          name: lingoswap-admin-service
          type: web
          property: host

  # ─── Auth Service ─────────────────────────────────────────────
  - type: web
    name: lingoswap-auth-service
    runtime: node
    rootDir: services/auth-service
    buildCommand: npm install
    startCommand: npm start
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5001
      - key: DB_URI
        sync: false  # MongoDB Atlas connection string
      - key: REDIS_URI
        fromService:
          name: lingoswap-redis
          type: redis
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRE
        value: 1d
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_REFRESH_EXPIRE
        value: 30d
      - key: OAUTH_CLIENT_ID
        sync: false
      - key: OAUTH_CLIENT_SECRET
        sync: false
      - key: OAUTH_REFRESH_TOKEN
        sync: false
      - key: MY_EMAIL_ACCOUNT
        sync: false
      - key: FRONTEND_URL
        sync: false

  # ─── User Service ──────────────────────────────────────────────
  - type: web
    name: lingoswap-user-service
    runtime: node
    rootDir: services/user-service
    buildCommand: npm install
    startCommand: npm start
    plan: free
